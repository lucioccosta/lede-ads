# Empacota e publica o Edge Linux (SB3000 com Arch no SD) nas GitHub Releases (OTA).
#
# Artefato: lede-edge-sb3000-linux-vX.Y.Z.tar.zst  (VERSION + lede_edge/)
# O Cloud classifica esse asset como target `sb3000-linux` (flavor `linux`).
#
# Disparos:
#   1) Push de tag  edge-sb3000-linux-vX.Y.Z  (deve bater com apps/edge-linux/VERSION)
#   2) Actions → "Edge SB3000 Linux Release" → Run workflow

name: Edge SB3000 Linux Release

on:
  push:
    tags:
      - "edge-sb3000-linux-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar GitHub Release com o pacote"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: edge-sb3000-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Edge Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          VER=$(tr -d '[:space:]' < apps/edge-linux/VERSION)
          TAG="edge-sb3000-linux-v${VER}"
          if [[ "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF#refs/tags/}" != "$TAG" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} não bate com VERSION ($VER)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg=lede-edge-sb3000-linux-v${VER}.tar.zst" >> "$GITHUB_OUTPUT"

      - name: Tests
        working-directory: apps/edge-linux
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: |
          sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zstd rsync
          apps/edge-linux/packaging/build-release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.pkg }}
          path: releases/edge/sb3000-linux/${{ steps.ver.outputs.pkg }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          PKG="releases/edge/sb3000-linux/${{ steps.ver.outputs.pkg }}"
          VER="${{ steps.ver.outputs.version }}"
          NOTES="Edge Linux SB3000 v${VER} — pacote OTA (flavor \`linux\`). Em **Telas**, devices Linux desatualizados mostram atualização disponível."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PKG" --clobber
          elif [[ "$GITHUB_REF" == "refs/tags/$TAG" ]]; then
            gh release create "$TAG" "$PKG" --title "Edge SB3000 Linux v${VER}" --notes "$NOTES"
          else
            gh release create "$TAG" "$PKG" --title "Edge SB3000 Linux v${VER}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
