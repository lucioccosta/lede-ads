services:
  postgres:
    image: postgres:16-alpine
    container_name: lede-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: lede
      POSTGRES_PASSWORD: lede
      POSTGRES_DB: lede_ads
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lede-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: lede-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: lede
      MINIO_ROOT_PASSWORD: ledepassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 lede ledepassword;
      mc mb -p local/lede-media || true;
      mc anonymous set download local/lede-media || true;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
