# seatd cedo junto com o LEDE Edge (não espera basic.target)
[Unit]
DefaultDependencies=no
After=systemd-remount-fs.service systemd-journald.socket
Before=shutdown.target
Conflicts=shutdown.target

[Service]
# PrivateTmp=true (padrão do pacote) força esperar systemd-tmpfiles-setup e
# local-fs.target (~15 s no SD). O seatd não usa /tmp.
PrivateTmp=no
